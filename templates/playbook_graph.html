{% extends "base.html" %}
{% block content %}
<div class="page-header">
    <div class="page-header-content">
        <h1 class="page-title">{{ filename }}</h1>
        <p class="page-subtitle">Playbook Graph</p>
    </div>
    <div class="page-header-actions">
        <a href="javascript:history.back()" class="action-button action-button-secondary">Back</a>
    </div>
</div>
<div class="content-card">
    <div class="card-body" style="overflow-x: auto;">
        <img src="{{ url_for('raw_playbook_graph', filename=filename) }}" alt="Playbook graph of {{ filename }}" style="max-width: none; display: block;">

    </div>
</div>
{% endblock %}
