{% extends "base.html" %}

{% block title %}Dashboard - NetPAC{% endblock %}

{% block content %}
<div class="dashboard-header">
    <div class="header-content">
        <h1 class="dashboard-title">Dashboard</h1>
    </div>
</div>

<div class="stats-container">
    <div class="stat-card stat-card-hosts">
        <div class="stat-content">
            <h3 class="stat-title">Total hosts</h3>
            <p class="stat-number">{{ all_hosts }}</p>
        </div>
    </div>

    <div class="stat-card stat-card-groups">
        <div class="stat-content">
            <h3 class="stat-title">Total groups</h3>
            <p class="stat-number">{{ all_groups }}</p>
        </div>
    </div>
</div>

<div class="dashboard-markdown-block markdown-body">
    {{ md | safe }}
</div>
{% endblock %}

{% block extra_js %}
<script>
    document.querySelectorAll('pre code').forEach(block => {
        block.removeAttribute('data-highlighted');
        hljs.highlightElement(block);
    });
</script>
{% endblock %}
