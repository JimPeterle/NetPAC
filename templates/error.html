<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ error_code }} - Server Error</title>
    <link rel="stylesheet" href="{{ vendor('jetbrains_mono', 'css') }}">
    <link rel="stylesheet" href="{{ vendor('jetbrains_mono', 'css_italic') }}">
    <link rel="stylesheet" href="{{ static_file('styles.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
</head>

<body class="error-body">

    <div class="error-background"></div>


    <div class="error-container">
        

        <div class="error-card">
            <h1 class="error-code">{{ error_code }}</h1>
            <h2 class="error-title">Oops! Something went wrong</h2>
            <p class="error-description">
                The server encountered an error and could not complete your request.
            </p>

            <div class="error-actions">
                <form method="POST" action="{{ url_for('logout') }}" style="margin: 0; display: inline;">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <button type="submit" class="error-button error-button-primary" style="cursor: pointer; border: none;">Logout</button>
                </form>
                <a href="javascript:history.back()" class="error-button error-button-secondary">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
                    <span>Go Back</span>
                </a>
            </div>
        </div>


        <div class="error-footer">
            <p>© 2026 NetPAC. Created by JimPeterle</p>
        </div>
    </div>

</body>
</html>
