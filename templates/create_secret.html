{% extends "base.html" %}

{% block title %}Create Secret - NetPAC{% endblock %}

{% block content %}
<div class="page-header">
    <div class="page-header-content">
        <h1 class="page-title">Create Secret</h1>
        <p class="page-subtitle">Add a new credential</p>
    </div>
    <div class="page-header-actions">
        <a href="{{ url_for('secrets') }}" class="action-button action-button-secondary">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
            <span>Back</span>
        </a>
    </div>
</div>

<div style="background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-md); margin-bottom: 24px;">
    <div style="padding: 24px 30px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;">
        <h3 style="font-size: 1.25rem; font-weight: 600; color: var(--text-primary); margin: 0;">Secret Information</h3>
        
        <div style="display: flex; gap: 12px;">
            <a href="{{ url_for('secrets') }}" class="action-button action-button-secondary">
                Cancel
            </a>
            <button type="submit" form="secretForm" class="action-button action-button-primary">
                Create Secret
            </button>
        </div>
    </div>
    
    <div style="padding: 30px;">
        <form method="POST" action="{{ url_for('create_secret') }}" id="secretForm">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div class="form-group" style="margin-bottom: 1.5rem;">
                <label class="form-label">Name *</label>
                <input type="text" name="name" class="form-input" 
                       placeholder="e.g. Cisco user" required>
            </div>

            <div class="form-group" style="margin-bottom: 1.5rem;">
                <label class="form-label">Username *</label>
                <input type="text" name="username" class="form-input" 
                       placeholder="e.g. admin" required>
            </div>

            <div class="form-group" style="margin-bottom: 1.5rem;">
                <label class="form-label">Password *</label>
                <div style="position: relative;">
                    <input type="password" name="password" id="password" 
                           class="form-input" required>
                    <button type="button" 
                            style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 0.875rem; color: var(--accent); font-weight: 500;"
                            onclick="togglePassword()" 
                            id="toggleBtn">
                        Show
                    </button>
                </div>
                <span class="form-hint" style="color: var(--danger); font-weight: 500;">
                    The password will be encrypted and cannot be displayed afterwards!
                </span>
            </div>

            <div class="form-group">
                <label class="form-label">Description</label>
                <textarea name="description" class="form-input" rows="3" 
                          style="resize: vertical;"
                          placeholder="Optional description for this secret"></textarea>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    function togglePassword() {
        const passwordInput = document.getElementById('password');
        const toggleBtn = document.getElementById('toggleBtn');
        
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            toggleBtn.textContent = 'Hide';
        } else {
            passwordInput.type = 'password';
            toggleBtn.textContent = 'Show';
        }
    }
</script>
{% endblock %}
