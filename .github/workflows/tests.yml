name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Oldest supported version and the version in the Docker image
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test tools
        run: pip install pytest pyflakes werkzeug

      - name: Lint (pyflakes)
        run: python -m pyflakes app maintenance/update_vendor.py tests

      - name: Run tests
        run: python -m pytest -v
