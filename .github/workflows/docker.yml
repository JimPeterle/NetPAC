name: Docker image

on:
  push:
    tags: ["v*"]
  schedule:
    # Every Monday 03:00 UTC: rebuild the latest release with current Ubuntu packages
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      build_main:
        description: "Build the current main branch for testing (tag 'main') instead of the latest release"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: source
        name: Select the version to build
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.build_main }}" = "true" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "latest=false" >> "$GITHUB_OUTPUT"
            echo "version=main" >> "$GITHUB_OUTPUT"
          else
            newest="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              tag="$GITHUB_REF_NAME"
            else
              tag="$newest"
            fi
            [ -n "$tag" ] || { echo "No release tag (v*) found"; exit 1; }
            git checkout --quiet "$tag"
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "latest=$([ "$tag" = "$newest" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
            echo "version=$tag" >> "$GITHUB_OUTPUT"
          fi
          echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/jimpeterle/netpac
          tags: |
            type=raw,value=main,enable=${{ steps.source.outputs.release == 'false' }}
            type=semver,pattern={{version}},value=${{ steps.source.outputs.version }},enable=${{ steps.source.outputs.release == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.source.outputs.version }},enable=${{ steps.source.outputs.release == 'true' }}
            type=semver,pattern={{major}},value=${{ steps.source.outputs.version }},enable=${{ steps.source.outputs.release == 'true' }}
            type=raw,value=latest,enable=${{ steps.source.outputs.latest == 'true' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APT_REFRESH=${{ steps.source.outputs.week }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
