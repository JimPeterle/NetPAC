name: CodeQL

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    # Every Monday 04:00 UTC: re-scan with the latest CodeQL queries
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ["python", "javascript-typescript"]
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality
          config: |
            paths-ignore:
              - app/static/vendor
              - tests

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
