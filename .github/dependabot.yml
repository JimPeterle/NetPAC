# Opens pull requests when GitHub Actions or the test tools have new versions
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: pip
    directory: /tests
    schedule:
      interval: weekly
    groups:
      test-tools:
        patterns: ["*"]
