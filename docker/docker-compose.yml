# NetPAC with Docker
#
# Next to this file you need secret.env (template: secret_examples.env).
# Build the image yourself from the repository root: docker build -f docker/Dockerfile -t ghcr.io/jimpeterle/netpac:latest .
# The database runs on the host (see README, "Database configuration").
# All containers use the host network, so DB_IP=127.0.0.1 works as with a normal installation.
#
# Start:   docker compose up -d
# Update:  docker compose pull && docker compose up -d

x-netpac: &netpac
  image: ghcr.io/jimpeterle/netpac:latest
  network_mode: host
  init: true
  restart: unless-stopped
  environment:
    # The containers run as the owner of secret.env (normally the user netpac).
    # To use another user, set its IDs here: PUID: "1001" and PGID: "1001"
    TZ: Europe/Berlin
  volumes:
    - ./secret.env:/home/netpac/bin/NetPAC/config/secret.env:ro
    - ./backups:/home/netpac/bin/netpac_backups
    - /var/lib/netpac:/var/lib/netpac
    - /var/log/netpac:/var/log/netpac
    - /etc/netpac/certs:/etc/netpac/certs
    - netpac-state:/home/netpac/state
    - netpac-venv:/home/netpac/bin/NetPAC/venv
    - netpac-ansible:/home/netpac/.ansible
    - netpac-ssh:/home/netpac/.ssh

services:
  web:
    <<: *netpac
    command: web
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8443/', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  scheduler:
    <<: *netpac
    command: scheduler
    depends_on:
      web:
        condition: service_healthy

  executor:
    <<: *netpac
    command: executor
    stop_grace_period: 30s
    depends_on:
      web:
        condition: service_healthy

  nginx:
    image: nginx:1.28
    network_mode: host
    restart: unless-stopped
    volumes:
      - /etc/netpac/certs:/etc/netpac/certs:ro
    configs:
      - source: netpac-nginx
        target: /etc/nginx/conf.d/default.conf
    depends_on:
      web:
        condition: service_healthy

configs:
  netpac-nginx:
    content: |
      upstream netpac_backend {
          server 127.0.0.1:8443 fail_timeout=0;
      }

      map $$request_method $$netpac_login_key {
          POST    $$binary_remote_addr;
          default "";
      }
      limit_req_zone $$netpac_login_key zone=netpac_login:10m rate=5r/m;

      server {
          listen 80 default_server;
          server_name _;
          return 301 https://$$host$$request_uri;
      }

      server {
          listen 443 ssl default_server;
          http2 on;
          server_name _;

          ssl_certificate /etc/netpac/certs/netpac.crt;
          ssl_certificate_key /etc/netpac/certs/netpac.key;
          ssl_protocols TLSv1.2 TLSv1.3;
          ssl_ciphers HIGH:!aNULL:!MD5;
          ssl_prefer_server_ciphers on;

          add_header X-Content-Type-Options "nosniff" always;
          add_header X-Frame-Options "SAMEORIGIN" always;
          add_header X-XSS-Protection "1; mode=block" always;
          add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
          add_header Referrer-Policy "strict-origin-when-cross-origin" always;
          add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;

          client_max_body_size 16M;
          limit_req_status 429;

          proxy_set_header Host $$host;
          proxy_set_header X-Real-IP $$remote_addr;
          proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $$scheme;
          proxy_read_timeout 300s;
          proxy_connect_timeout 300s;
          proxy_send_timeout 300s;
          proxy_http_version 1.1;

          location ~ ^/(totp/(verify|setup))?$$ {
              limit_req zone=netpac_login burst=3 nodelay;
              proxy_pass http://netpac_backend;
          }

          location / {
              proxy_pass http://netpac_backend;
          }
      }

volumes:
  netpac-state:
  netpac-venv:
  netpac-ansible:
  netpac-ssh:
